<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroHealth | Team NeuroNauts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        /* ব্যাকগ্রাউন্ডে মহাকাশ এবং ডার্ক ওভারলে */
        body {
            background: linear-gradient(rgba(3, 8, 16, 0.88), rgba(3, 8, 16, 0.94)), 
                        url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #F8FAFC;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5, h6, .brand-title, .metric-value {
            font-family: 'Orbitron', sans-serif;
        }

        .text-neuro-green, .text-neon {
            color: #10B981 !important;
            text-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
        }

        .border-neuro-green, .border-cyan {
            border-left: 4px solid #10B981 !important;
        }

        .bg-neuro-green-glow {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid #10B981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
        }

        .nasa-card, .hud-card {
            background: rgba(10, 20, 32, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }

        .nasa-card::before, .hud-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #10B981, transparent);
        }

        .nasa-btn, .hud-btn {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: #FFFFFF !important;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid #10B981;
            padding: 12px 24px;
            border-radius: 6px;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
            text-decoration: none;
        }

        .nasa-btn:hover, .hud-btn:hover {
            background: linear-gradient(135deg, #047857 0%, #059669 100%);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.8);
            transform: translateY(-2px);
            color: #FFFFFF !important;
        }

        /* নেভিগেশন বাটন স্টাইল */
        .btn-nav-custom {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #10B981 !important;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav-custom:hover {
            background: #10B981;
            color: #050C16 !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
            transform: translateY(-1px);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #EF4444;
            color: #F87171 !important;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-logout:hover {
            background: #EF4444;
            color: #FFFFFF !important;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
        }

        .live-dot {
            height: 10px;
            width: 10px;
            background-color: #10B981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 12px #10B981;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
    </style>
</head>
<body>
    <!-- মিশন কন্ট্রোল নেভিগেশন বার -->
    <div class="py-3 mb-4" style="background: rgba(5, 12, 22, 0.9); border-bottom: 1px solid rgba(16, 185, 129, 0.3);">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
            <!-- ব্র্যান্ড নাম -->
            <div class="d-flex align-items-center gap-3">
                <span class="live-dot"></span>
                <a href="{% url 'reaction_test' %}" class="text-decoration-none">
                    <h3 class="brand-title text-neuro-green mb-0 fs-4">NeuroHealth </h3>
                </a>
            </div>
            
            <!-- ব্যাক, হোম এবং লগআউট নেভিগেশন কন্ট্রোল -->
            <div class="d-flex align-items-center gap-2">
                {% if user.is_authenticated or request.session.astronaut_id %}
                    <!-- BACK BUTTON -->
                    <button onclick="history.back()" class="btn-nav-custom">
                        <i class="bi bi-arrow-left"></i> BACK
                    </button>

                    <!-- HOME BUTTON -->
                    <a href="{% url 'reaction_test' %}" class="btn-nav-custom">
                        <i class="bi bi-house-door-fill"></i> HOME
                    </a>

                    <!-- ASTRONAUT PROFILE BADGE -->
                    <span class="text-light opacity-75 small d-none d-lg-inline mx-2" style="font-family:'Orbitron';">
                        ID: <strong class="text-neuro-green">{{ request.session.astronaut_id|default:user.username }}</strong>
                    </span>

                    <!-- LOGOUT BUTTON -->
                    <a href="{% url 'logout' %}" class="btn-logout">
                        <i class="bi bi-box-arrow-right"></i> LOGOUT
                    </a>
                {% else %}
                    <span class="badge bg-black text-neuro-green border border-success px-3 py-2" style="font-family:'Orbitron';">
                        NASA HRP STANDARDS COMPLIANT
                    </span>
                {% endif %}
            </div>
        </div>
    </div>

    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
