{% extends 'base.html' %}
{% block content %}
<div class="mb-4">
    <h3 class="font-monospace fw-bold text-white mb-0">
        <i class="bi bi-gear-fill text-info me-2"></i>SETTINGS & CONFIGURATION
    </h3>
    <small class="text-secondary font-monospace">System Telemetry & Monitoring Preferences</small>
</div>

<div class="row g-3">
    <div class="col-12 col-lg-8">
        <div class="hud-card mb-3 p-3 p-md-4">
            <span class="font-monospace text-info fw-bold d-block mb-3" style="letter-spacing: 1px;">
                TELEMETRY PREFERENCES
            </span>
            
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="realtimeAlerts" checked>
                <label class="form-check-label text-light font-monospace small" for="realtimeAlerts">
                    Real-Time Neuro-Fatigue Audio Alerts
                </label>
            </div>
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="autoSync" checked>
                <label class="form-check-label text-light font-monospace small" for="autoSync">
                    Auto-Sync Data with Ground Control
                </label>
            </div>
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="highPrecision">
                <label class="form-check-label text-light font-monospace small" for="highPrecision">
                    High-Frequency EEG Sampling Rate (1000Hz)
                </label>
            </div>
        </div>

        <div class="hud-card p-3 p-md-4">
            <span class="font-monospace text-info fw-bold d-block mb-3" style="letter-spacing: 1px;">
                SYSTEM ACTIONS
            </span>
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-outline-info font-monospace btn-sm flex-fill">Recalibrate Sensors</button>
                <button class="btn btn-outline-warning font-monospace btn-sm flex-fill">Clear Local Data Cache</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
