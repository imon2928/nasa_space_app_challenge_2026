{% extends 'base.html' %}
{% block content %}
<div class="mb-4">
    <h3 class="font-monospace fw-bold text-white mb-0"><i class="bi bi-gear-fill text-info me-2"></i>SETTINGS & CONFIGURATION</h3>
    <small class="text-secondary">System Telemetry & Monitoring Preferences</small>
</div>

<div class="row g-3">
    <div class="col-md-8">
        <div class="hud-card mb-3">
            <span class="font-monospace text-info fw-bold d-block mb-3">TELEMETRY PREFERENCES</span>
            
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="realtimeAlerts" checked>
                <label class="form-check-label text-light font-monospace" for="realtimeAlerts">Real-Time Neuro-Fatigue Audio Alerts</label>
            </div>
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="autoSync" checked>
                <label class="form-check-label text-light font-monospace" for="autoSync">Auto-Sync Data with Ground Control</label>
            </div>
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="highPrecision">
                <label class="form-check-label text-light font-monospace" for="highPrecision">High-Frequency EEG Sampling Rate (1000Hz)</label>
            </div>
        </div>

        <div class="hud-card">
            <span class="font-monospace text-info fw-bold d-block mb-3">SYSTEM ACTIONS</span>
            <button class="btn btn-outline-info font-monospace btn-sm me-2">Recalibrate Sensors</button>
            <button class="btn btn-outline-warning font-monospace btn-sm">Clear Local Data Cache</button>
        </div>
    </div>
</div>
{% endblock %}
