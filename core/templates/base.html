<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEUROGUARD // NASA SPACE APPS 2026</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root {
            --primary-cyan: #00F0FF;
            --primary-purple: #8A2BE2;
            --dark-bg: #030712;
            --card-bg: rgba(15, 23, 42, 0.75);
            --border-glow: rgba(0, 240, 255, 0.3);
        }

        body {
            background: linear-gradient(rgba(3, 7, 18, 0.92), rgba(3, 7, 18, 0.95)), 
                        url('https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #F1F5F9;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
        }

        /* হেডার টাইপোগ্রাফি */
        h1, h2, h3, h4, h5, h6, .brand-title {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }

        /* HUD Glassmorphism Card Style */
        .nasa-card, .hud-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 240, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .nasa-card::after, .hud-card::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 20px; height: 20px;
            border-right: 2px solid var(--primary-cyan);
            border-bottom: 2px solid var(--primary-cyan);
        }

        /* নেভিগেশন হেডার */
        .header-box {
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        /* সাইবার বাটন স্টাইল */
        .nasa-btn, .hud-btn {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2) 0%, rgba(138, 43, 226, 0.4) 100%);
            color: #FFFFFF !important;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            border: 1px solid var(--primary-cyan);
            padding: 14px 28px;
            border-radius: 8px;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            display: inline-block;
            text-decoration: none;
        }

        .nasa-btn:hover, .hud-btn:hover {
            background: linear-gradient(135deg, var(--primary-cyan) 0%, var(--primary-purple) 100%);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.6);
            transform: translateY(-2px);
            color: #000 !important;
        }

        .text-cyan, .text-neon {
            color: var(--primary-cyan) !important;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
        }

        .border-cyan {
            border-left: 4px solid var(--primary-cyan) !important;
        }

        /* লাইভ স্ট্যাটাস ডট */
        .live-dot {
            height: 10px;
            width: 10px;
            background-color: var(--primary-cyan);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 12px var(--primary-cyan);
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <!-- base.html-এর হেডার অংশটুকু এতে রিপ্লেস কর -->
<div class="header-box mb-4 py-3">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
            <i class="bi bi-cpu text-neon fs-3"></i>
            <h3 class="fw-bold brand-title text-neon mb-0 fs-4">Neuro-Health <span class="fs-6 text-white-50 d-none d-sm-inline">| Team NeuroNauts</span></h3>
        </div>
        
        <div class="d-flex align-items-center gap-3">
            {% if user.is_authenticated %}
                <span class="text-neon font-monospace fs-6"><i class="bi bi-person-badge me-1"></i> {{ user.username }}</span>
                <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm px-3" style="font-family:'Orbitron';">
                    <i class="bi bi-power me-1"></i> LOGOUT
                </a>
            {% else %}
                <span class="live-dot"></span>
                <span class="badge bg-black border border-cyan text-neon px-3 py-2" style="font-family:'Orbitron'; font-size:0.75rem;">
                    SYSTEM ONLINE
                </span>
            {% endif %}
        </div>
    </div>
</div>

    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
